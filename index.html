<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Run history of an automated daily LinkedIn posting agent.">
  <title>Daily Assistant: post history</title>

  <!--
    Daily Assistant Dashboard
    -------------------------
    A static, responsive page that displays the contents of history.json:
    run summary, status filters, search, and one entry per daily run.

    - Hosted on GitHub Pages; no build step and no external dependencies.
    - All data from history.json is escaped before it is displayed.
    - Keyboard accessible, with visible focus and reduced-motion support.
  -->
  <style>
    /* ---------- Design tokens ---------- */
    :root {
      /* Surfaces */
      --page: #F4F6F8;
      --surface: #FFFFFF;
      --line: #DDE3E8;
      --line-strong: #C5CED6;

      /* Text */
      --ink: #14212B;
      --muted: #5B6875;

      /* Brand */
      --brand: #0F766E;
      --brand-soft: #E3F3F1;

      /* Status colors (text on tinted background) */
      --posted: #1A7F4B;   --posted-bg: #E5F4EB;
      --preview: #8A5A00;  --preview-bg: #FBF0D9;
      --skipped: #50607A;  --skipped-bg: #E8ECF2;
      --failed: #B3261E;   --failed-bg: #FBE7E5;

      --radius: 8px;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 40px 20px 72px;
    }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    /* ---------- Header ---------- */
    .page-header { margin-bottom: 28px; }

    .page-header h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .page-header p {
      margin: 0;
      max-width: 60ch;
      color: var(--muted);
    }

    .last-run {
      margin-top: 10px;
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* ---------- Summary ---------- */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      margin: 0 0 28px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .summary div {
      padding: 16px 18px;
      border-left: 1px solid var(--line);
    }

    .summary div:first-child { border-left: none; }

    .summary dt {
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .summary dd {
      margin: 2px 0 0;
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* ---------- Toolbar: filters and search ---------- */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filters button {
      padding: 7px 14px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--ink);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .filters button:hover { border-color: var(--brand); }

    .filters button[aria-pressed="true"] {
      background: var(--brand);
      border-color: var(--brand);
      color: #FFFFFF;
    }

    .filters .count {
      margin-left: 4px;
      opacity: 0.75;
      font-variant-numeric: tabular-nums;
    }

    .search {
      width: 100%;
      max-width: 260px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      color: var(--ink);
      font: inherit;
      font-size: 0.875rem;
    }

    .search::placeholder { color: var(--muted); }

    /* ---------- Entries ---------- */
    .entry {
      --status: var(--skipped);
      --status-bg: var(--skipped-bg);

      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 20px;
      margin-bottom: 12px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--status);   /* Border color encodes the run status */
      border-radius: var(--radius);
    }

    .entry[data-status="posted"]  { --status: var(--posted);  --status-bg: var(--posted-bg); }
    .entry[data-status="preview"] { --status: var(--preview); --status-bg: var(--preview-bg); }
    .entry[data-status="skipped"] { --status: var(--skipped); --status-bg: var(--skipped-bg); }
    .entry[data-status="failed"]  { --status: var(--failed);  --status-bg: var(--failed-bg); }

    .entry-date { font-size: 0.875rem; }
    .entry-date strong { display: block; font-weight: 600; }
    .entry-date span { color: var(--muted); }

    .entry-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .badge {
      padding: 2px 10px;
      background: var(--status-bg);
      border-radius: 999px;
      color: var(--status);
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .topic {
      padding: 2px 10px;
      background: var(--brand-soft);
      border-radius: 999px;
      color: var(--brand);
      font-size: 0.8125rem;
    }

    .entry h2 {
      margin: 0 0 10px;
      font-size: 1.0625rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .entry-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .entry-body.has-image { grid-template-columns: 96px 1fr; }

    .entry-image {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .entry-text {
      margin: 0;
      max-width: 72ch;
      color: #34424F;
      font-size: 0.9375rem;
      white-space: pre-line;          /* Keeps the line breaks of the original post */
    }

    .entry-text.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .toggle {
      margin-top: 6px;
      padding: 0;
      background: none;
      border: none;
      color: var(--brand);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle:hover { text-decoration: underline; }

    .entry-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.875rem;
    }

    .entry-links a {
      color: var(--brand);
      font-weight: 600;
      text-decoration: none;
    }

    .entry-links a:hover { text-decoration: underline; }

    .entry-reason {
      margin: 12px 0 0;
      padding: 8px 12px;
      background: var(--failed-bg);
      border-radius: var(--radius);
      color: var(--failed);
      font-size: 0.875rem;
    }

    /* ---------- States ---------- */
    .state {
      padding: 48px 16px;
      text-align: center;
      color: var(--muted);
    }

    /* ---------- Small screens ---------- */
    @media (max-width: 640px) {
      .wrap { padding: 28px 14px 56px; }
      .entry { grid-template-columns: 1fr; gap: 10px; padding: 16px; }
      .entry-date strong, .entry-date span { display: inline; }
      .entry-date span::before { content: " at "; }
      .summary div:nth-child(odd) { border-left: none; }
      .search { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="page-header">
      <h1>Daily Assistant</h1>
      <p>Every run of the automated LinkedIn posting agent, with its status, source story, and the post text.</p>
      <div class="last-run" id="last-run"></div>
    </header>

    <dl class="summary" id="summary" aria-label="Run summary"></dl>

    <div class="toolbar">
      <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
      <input class="search" id="search" type="search"
             placeholder="Search title, topic, or post" aria-label="Search runs">
    </div>

    <section id="list" aria-live="polite">
      <div class="state">Loading history…</div>
    </section>
  </main>

  <script>
    // ---------------------------------------------------------------
    // Configuration
    // ---------------------------------------------------------------
    const HISTORY_URL = "history.json";
    const LONG_TEXT_LIMIT = 220;   // Posts longer than this get a "Read more" toggle

    const STATUS_FILTERS = [
      { key: "all", label: "All" },
      { key: "posted", label: "Posted" },
      { key: "preview", label: "Preview" },
      { key: "skipped", label: "Skipped" },
      { key: "failed", label: "Failed" },
    ];

    // ---------------------------------------------------------------
    // State
    // ---------------------------------------------------------------
    let allEntries = [];         // All history records, newest first
    let activeFilter = "all";    // Selected status filter
    let searchQuery = "";        // Current search text (lowercase)

    const summaryEl = document.getElementById("summary");
    const filtersEl = document.getElementById("filters");
    const searchEl = document.getElementById("search");
    const listEl = document.getElementById("list");
    const lastRunEl = document.getElementById("last-run");

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------

    /** Escape text so it is shown as text and never interpreted as HTML. */
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    /** Return the URL only if it is a normal web link; otherwise an empty string. */
    function safeUrl(url) {
      return /^https?:\/\//i.test(url || "") ? escapeHtml(url) : "";
    }

    /** Format "2026-10-19" as "19 Oct 2026". Falls back to the original text. */
    function formatDate(value) {
      const date = new Date(value + "T00:00:00");
      if (Number.isNaN(date.getTime())) return value || "";
      return date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    /** Count the entries that have the given status ("all" counts everything). */
    function countByStatus(status) {
      if (status === "all") return allEntries.length;
      return allEntries.filter((entry) => entry.status === status).length;
    }

    /** Return the entries that match the active filter and the search text. */
    function getVisibleEntries() {
      return allEntries.filter((entry) => {
        const matchesStatus = activeFilter === "all" || entry.status === activeFilter;
        const haystack = `${entry.title} ${entry.topic} ${entry.post}`.toLowerCase();
        return matchesStatus && haystack.includes(searchQuery);
      });
    }

    // ---------------------------------------------------------------
    // Rendering
    // ---------------------------------------------------------------

    /** Draw the run summary and the "last run" line. */
    function renderSummary() {
      const items = [
        ["Total runs", countByStatus("all")],
        ["Posted live", countByStatus("posted")],
        ["Previews", countByStatus("preview")],
        ["Skipped", countByStatus("skipped")],
        ["Failed", countByStatus("failed")],
      ];

      summaryEl.innerHTML = items
        .map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`)
        .join("");

      const latest = allEntries[0];
      lastRunEl.textContent = latest
        ? `Last run: ${formatDate(latest.date)} at ${latest.time} IST`
        : "";
    }

    /** Draw the status filter buttons with their counts. */
    function renderFilters() {
      filtersEl.innerHTML = STATUS_FILTERS
        .map(({ key, label }) => `
          <button type="button" data-filter="${key}" aria-pressed="${key === activeFilter}">
            ${label}<span class="count">${countByStatus(key)}</span>
          </button>`)
        .join("");
    }

    /** Build the HTML for one history entry. */
    function renderEntry(entry, index) {
      const source = safeUrl(entry.source_url);
      const linkedin = safeUrl(entry.linkedin_url);
      const post = entry.post || "";
      const isLong = post.length > LONG_TEXT_LIMIT;

      const image = entry.image
        ? `<img class="entry-image" src="${escapeHtml(entry.image)}" alt="" onerror="this.remove()">`
        : "";

      return `
        <article class="entry" data-status="${escapeHtml(entry.status)}">
          <div class="entry-date">
            <strong>${escapeHtml(formatDate(entry.date))}</strong>
            <span>${escapeHtml(entry.time)} IST</span>
          </div>

          <div>
            <div class="entry-head">
              <span class="badge">${escapeHtml(entry.status)}</span>
              ${entry.topic ? `<span class="topic">${escapeHtml(entry.topic)}</span>` : ""}
            </div>

            <h2>${escapeHtml(entry.title) || "Untitled run"}</h2>

            ${post ? `
              <div class="entry-body ${image ? "has-image" : ""}">
                ${image}
                <div>
                  <p class="entry-text ${isLong ? "collapsed" : ""}" id="post-${index}">${escapeHtml(post)}</p>
                  ${isLong ? `<button type="button" class="toggle" data-target="post-${index}" aria-expanded="false">Read more</button>` : ""}
                </div>
              </div>` : ""}

            ${(source || linkedin) ? `
              <div class="entry-links">
                ${source ? `<a href="${source}" target="_blank" rel="noopener noreferrer">Read the source story</a>` : ""}
                ${linkedin ? `<a href="${linkedin}" target="_blank" rel="noopener noreferrer">View on LinkedIn</a>` : ""}
              </div>` : ""}

            ${entry.reason ? `<p class="entry-reason">${escapeHtml(entry.reason)}</p>` : ""}
          </div>
        </article>`;
    }

    /** Draw the list of entries for the current filter and search. */
    function renderList() {
      const visible = getVisibleEntries();

      if (visible.length === 0) {
        listEl.innerHTML = `<div class="state">No runs match your filter. Choose another status or clear the search.</div>`;
        return;
      }
      listEl.innerHTML = visible.map(renderEntry).join("");
    }

    // ---------------------------------------------------------------
    // Data loading
    // ---------------------------------------------------------------

    /** Fetch history.json (cache-busted) and draw the page. */
    async function loadHistory() {
      try {
        const response = await fetch(`${HISTORY_URL}?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        allEntries = data.slice().reverse();   // Newest first
        renderSummary();
        renderFilters();
        renderList();
      } catch (error) {
        listEl.innerHTML = `<div class="state">Could not load history.json. Check that the file exists in the repository, then refresh the page.</div>`;
      }
    }

    // ---------------------------------------------------------------
    // Events
    // ---------------------------------------------------------------

    // Status filter buttons
    filtersEl.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      renderFilters();
      renderList();
    });

    // Search box
    searchEl.addEventListener("input", () => {
      searchQuery = searchEl.value.trim().toLowerCase();
      renderList();
    });

    // "Read more" and "Show less" buttons
    listEl.addEventListener("click", (event) => {
      const button = event.target.closest(".toggle");
      if (!button) return;

      const text = document.getElementById(button.dataset.target);
      const isCollapsed = text.classList.toggle("collapsed");
      button.textContent = isCollapsed ? "Read more" : "Show less";
      button.setAttribute("aria-expanded", String(!isCollapsed));
    });

    loadHistory();
  </script>
</body>
</html>
